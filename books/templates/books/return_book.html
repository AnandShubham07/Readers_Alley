{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Return Book</title>
    <link rel="stylesheet" href="{% static 'books/style.css' %}">
</head>
<body>
    <main class="hero">
        <h1>Return a Book</h1>
        <p>{{ message }}</p>

        <form method="POST">
            {% csrf_token %}
            <label>Book ID</label>
            <input name="book_id" maxlength="20" required>

            <button type="submit" class="button button-primary">
                Return Book
            </button>
        </form>

        <a href="{% url 'admin_dashboard' %}">Back to Dashboard</a>
    </main>
</body>
</html>
